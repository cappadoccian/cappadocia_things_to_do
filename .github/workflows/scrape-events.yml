name: Etkinlik Senkronizasyonu

on:
  schedule:
    # Her 6 saatte bir (UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scrapers
        run: python -m scraper.run_scrapers

      - name: Commit updated data if changed
        run: |
          git config user.name "cappadocia-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/scraped-events.json public/scraped-meta.json
          git diff --staged --quiet || git commit -m "chore: senkronize edilmiş etkinlikleri güncelle"
          git push
